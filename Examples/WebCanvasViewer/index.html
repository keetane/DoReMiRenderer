<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DoReMiRenderer Web Canvas Viewer</title>
    <style>
      @font-face { font-family: Bravura; src: url("Bravura.otf") format("opentype"); font-display: block; }
      body { margin: 0; background: #f4f5f7; color: #181a1f; font-family: system-ui, sans-serif; }
      main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
      canvas { display: block; width: 100%; background: #fff; box-shadow: 0 1px 4px #0002; }
      #status { margin: 16px 0; padding: 12px; border-radius: 6px; background: #fff3cd; color: #5f4600; }
      #status[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <p id="status" role="status">Loading notation font and score…</p>
      <canvas aria-label="Rendered music score"></canvas>
    </main>
    <script type="module">
      import { drawScoreCanvas, ensureSMuFLFont } from "./score-canvas.js";

      const canvas = document.querySelector("canvas");
      const status = document.querySelector("#status");
      let plan;
      try {
        const [response] = await Promise.all([
          fetch("./score-web.json"),
          ensureSMuFLFont(),
        ]);
        if (!response.ok) throw new Error(`Could not load score-web.json (${response.status}).`);
        plan = await response.json();
        drawScoreCanvas(canvas, plan);
        status.hidden = true;

        let pending = false;
        addEventListener("resize", () => {
          if (pending) return;
          pending = true;
          requestAnimationFrame(() => {
            pending = false;
            drawScoreCanvas(canvas, plan);
          });
        });
      } catch (error) {
        canvas.hidden = true;
        status.textContent = `Score viewer could not start: ${error.message}`;
      }
    </script>
  </body>
</html>
